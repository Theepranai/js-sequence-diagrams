<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="underscore-min.js"></script>
    <script src="raphael-min.js"></script>
    <script src="sequence-diagram-min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .column {
            flex: 1;
        }
        #diagram-input {
            width: 90%;
            height: 200px;
        }
        #diagram-container {
            min-height: 200px;
        }
        /* Adjust column widths */
        .column:first-child {
            flex: 0 0 40%; /* 40% width for the first column */
        }
        .column:last-child {
            flex: 0 0 60%; /* 60% width for the second column */
        }
        /* Responsive design for mobile view */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            #diagram-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>js-sequence-diagrams</h1>
    </header>
    <div class="container">
        <div class="column">
            <small>Turns text into UML sequence diagrams</small>
<br><br>
            <textarea id="diagram-input">Title: Hello World
A->B: Hello
B->C:
C->A: Back to A.
A->D: Go for D
            </textarea>
            <br>
            <button id="render-button">Render Diagram</button>
            <select id="theme-selector">
                <option value="hand">Hand-drawn</option>
                <option value="simple">Simple</option>
            </select>
        </div>
        <div class="column" id="diagram-container"></div>
    </div>
    <script>
        $(document).ready(function () {
            // Handle the render button click
            $("#render-button").click(function () {
                const input = $("#diagram-input").val();
                const theme = $("#theme-selector").val(); // Get the selected theme
                const $container = $("#diagram-container");

                // Clear the container before rendering a new diagram
                $container.empty();

                try {
                    const diagram = Diagram.parse(input);
                    diagram.drawSVG("diagram-container", { theme: theme }); // Use the selected theme
                } catch (error) {
                    $container.html(`<p style="color: red;">Error: ${error.message}</p>`);
                }
            });
        });
    </script>
</body>
</html>
